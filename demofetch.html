
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Products</title>
    <style>
        table {
            background-color: aqua;
            color: red;
            border: 2px solid black;
            margin: auto;
            padding: 20px;
            border-collapse: collapse; 
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Sr.no</th>
                <th>Title</th>
                <th>Images</th>
                <th>Category</th>
                <th>Price</th>
                <th>Rating</th>
                <th></th>
                
            </tr>
        </thead>
        
        <tbody id="data">
            
        </tbody>
    </table>

    <script>
        const url = "https://dummyjson.com/products?limit=10";  //use limit to take limited

        const urlC="https://open.er-api.com/v6/latest/USD";
        
        async function loadProducts() {
            try {
                const ratePromise=USDtoINR();
                const res = await fetch(url);
                const data = await res.json();

                const exchangeRate= await ratePromise;
                
               
                const tableBody = document.getElementById("data");
                
                
                let tableContent = "";
                
                data.products.forEach((product, index) => {
                    tableContent += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${product.title}</td>
                            <td><img src="${product.images[0]}" width="50px"></td>
                            <td>${product.category}</td>
                            <td>₹${(exchangeRate*product.price).toFixed(2) }</td>
                            <td>${product.rating}</td>
                            <td><button>Add to Cart</button></td>
                            
                        </tr>
                    `;
                });
                
                
                tableBody.innerHTML = tableContent;
                
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }
        ////////////////////
        async function USDtoINR()
        {
            try{
                const res=await fetch(urlC);
                const data= await res.json();

                const usd=data.rates.INR;

                return usd;
            }catch(e){
                console.log("Error:",e);
            }
            
        }
        
        loadProducts();
    </script>
</body>
</html>
