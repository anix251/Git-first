<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>
    <style>
        body{
            margin: 0;
            text-align: center;
        }
        
        .card{
            width: 200px;
            height: 200px;
            background-color: bisque;
            border: 2px solid rgb(83, 1, 1);
            border-radius: 20px;
            margin: auto;
            text-align: center;
            padding: 10px;
        }
        .box{
            width: 200px;
            height: 300px;
            border: 1px solid black;
            border-radius: 10%;
            margin: 50px;
            padding: 50px;
        }
        #root{
            display: flex;
            flex-wrap: wrap;
            row-gap: 10px;
        }
    </style>
</head>
<body>
    <h1>Book Store</h1>
    <div id="root"></div>

    <script src="bookStore.js"></script>
</body>
</html>
